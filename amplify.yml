version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # If these print MISSING, Amplify is not injecting vars into CodeBuild (fix console / branch scope).
        - test -n "$NEXTAUTH_SECRET" && echo "Build env NEXTAUTH_SECRET present" || echo "Build env NEXTAUTH_SECRET MISSING"
        - test -n "$GOOGLE_CLIENT_ID" && echo "Build env GOOGLE_CLIENT_ID present" || echo "Build env GOOGLE_CLIENT_ID MISSING"
        - test -n "$DYNAMO_TABLE_PREFIX" && echo "Build env DYNAMO_TABLE_PREFIX=$DYNAMO_TABLE_PREFIX" || echo "Build env DYNAMO_TABLE_PREFIX MISSING (app falls back to mm)"
        - node scripts/write-amplify-auth-env.js prebuild
        - node scripts/amplify-prebuild-auth.js
        - npm run build
        - node scripts/write-amplify-auth-env.js
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
