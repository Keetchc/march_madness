version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "MM_REGION=\"${MM_REGION}\"" >> .env.production
        - echo "MM_ACCESS_KEY_ID=\"${MM_ACCESS_KEY_ID}\"" >> .env.production
        - echo "MM_SECRET_ACCESS_KEY=\"${MM_SECRET_ACCESS_KEY}\"" >> .env.production
        - echo "TOURNAMENT_ID=\"${TOURNAMENT_ID}\"" >> .env.production
        - echo "NEXTAUTH_SECRET=\"${NEXTAUTH_SECRET}\"" >> .env.production
        - echo "NEXTAUTH_URL=\"${NEXTAUTH_URL}\"" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
